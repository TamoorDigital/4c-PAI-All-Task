<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Bella Cucina — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">🍝</div>
      <h1 class="brand-name">La Bella<br>Cucina</h1>
      <p class="brand-sub">Authentic Italian · Since 1998</p>
    </div>

    <nav class="quick-actions">
      <p class="nav-label">Quick Questions</p>
      <button class="quick-btn" data-msg="What are your opening hours?">🕐 Opening Hours</button>
      <button class="quick-btn" data-msg="Show me the full menu">🍽️ Full Menu</button>
      <button class="quick-btn" data-msg="What pasta dishes do you have?">🍝 Pasta</button>
      <button class="quick-btn" data-msg="What desserts are available?">🍮 Desserts</button>
      <button class="quick-btn" data-msg="What vegetarian options do you have?">🥗 Vegetarian</button>
      <button class="quick-btn" data-msg="How do I make a reservation?">📅 Reservations</button>
      <button class="quick-btn" data-msg="Where are you located?">📍 Location</button>
      <button class="quick-btn" data-msg="What do you recommend?">⭐ Recommendations</button>
    </nav>

    <div class="sidebar-info">
      <p>📞 +1 (212) 555-0198</p>
      <p>📍 42 Maple St, NY</p>
      <p>🕐 Mon–Thu: 11am–10pm</p>
      <p>🕐 Fri–Sat: 11am–11:30pm</p>
    </div>
  </aside>

  <!-- Main Chat -->
  <main class="chat-container">
    <header class="chat-header">
      <div class="header-info">
        <span class="status-dot"></span>
        <span>Virtual Host — Online</span>
      </div>
      <div class="header-title">La Bella Cucina Assistant</div>
    </header>

    <div class="chat-messages" id="chatMessages">
      <!-- Welcome message injected by JS -->
    </div>

    <footer class="chat-input-area">
      <div class="input-row">
        <input
          type="text"
          id="userInput"
          placeholder="Ask about menu, hours, reservations…"
          autocomplete="off"
        />
        <button id="sendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <p class="input-hint">Press Enter or click Send</p>
    </footer>
  </main>

  <script src="/static/js/chat.js"></script>
</body>
</html>
